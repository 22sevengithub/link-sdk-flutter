# Code Hygiene (VLT22-12767): one grouped Dependabot PR per ecosystem per week.
# Minor and patch updates are grouped, and all major updates are grouped into a second PR
# that needs a closer look (changelogs, breaking changes).
# The 7-day cooldown keeps brand-new releases out until they have been public for a week.
# Approve with `gh pr review --approve`, then merge: `gh pr merge --auto --squash` where
# auto-merge is enabled (it waits for the required CI check), otherwise `gh pr merge --squash`
# once CI is green.
version: 2
updates:
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/example"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Belgrade"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      pub-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      pub-security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
      pub-major:
        applies-to: version-updates
        update-types: ["major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Belgrade"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        update-types: ["minor", "patch"]
      actions-major:
        applies-to: version-updates
        update-types: ["major"]
